<!DOCTYPE html>
<html>
<head>
  <title>This site can't be reached</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff;
      color: #333;
      text-align: center;
      margin: 80px auto;
      max-width: 600px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    p {
      font-size: 16px;
      color: #555;
    }
    ul {
      text-align: left;
      display: inline-block;
      margin-top: 10px;
      color:rebeccapurple;
    }
    .error-code {
      margin-top: 15px;
      font-weight: bold;
      color: #888;
    }
    .btn {
      background-color:#04233d;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn:hover {
      background-color: #005fa3;
    }
    .error-icon {
      font-size: 80px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="error-icon">😕</div>
  <h1>This site can't be reached</h1>
  <p><strong>kpkb.mha.gov.in</strong> took too long to respond.</p>
  <ul>
    <li>Checking the connection</li>
    <li>Checking the proxy and the firewall</li>
    <li>Running Windows Network Diagnostics</li>
  </ul>
  <p class="error-code">ERR_CONNECTION_TIMED_OUT</p>
  <button class="btn">Reload</button>
</body>
</html>
